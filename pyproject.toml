[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mct-ble"
version = "0.1.0"
description = "Upload files to and run scripts on the ESP32 over Bluetooth LE"
requires-python = ">=3.10"
dependencies = ["bleak~=3.0", "mpremote~=1.29"]

[project.scripts]
mpble = "ble_push:main"

[tool.setuptools]
package-dir = { "" = "tools" }
py-modules = ["ble_push"]
